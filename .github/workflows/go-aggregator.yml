name: Go Aggregator CI

# Unconditional, not path-filtered. build-and-test is a required branch
# protection check, and a required check that is also path-filtered can never
# be satisfied on a PR that happens not to touch those paths: GitHub has no
# native "required only when relevant" mode, so the PR is stuck forever on
# "Expected — waiting for status to be reported". This is that fix, applied
# after hitting it on a real PR. Same call already made for windows-build.yml:
# a few extra seconds of CI on unrelated commits costs less than a merge that
# cannot complete.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-aggregator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-aggregator/go.mod  # reads 'go' directive — no hardcoded version
          cache: true                              # caches module cache between runs
          cache-dependency-path: go-aggregator/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          # git diff fails with "no such path" for untracked files; use ls-files to check
          # what is actually tracked, then diff only those.
          TRACKED=$(git ls-files go.mod go.sum)
          git diff --exit-code $TRACKED || (echo "ERROR: run 'go mod tidy' locally and commit the result" && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector enabled)
        # -race catches data races in concurrent code — critical for this service.
        # -count=1 disables the test cache so every CI run executes tests fresh.
        run: go test -race -count=1 -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go-aggregator
          version: v2.13.2

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
