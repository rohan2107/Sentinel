name: Windows Build (CMake + vcpkg)

# Manual-only, deliberately. The C++ agent is genuinely cross-platform (only
# ~10% of its source is inside #ifdef _WIN32, concentrated almost entirely in
# osquery_runner.cpp's process-spawning code, which necessarily differs by
# OS), but this workflow's two real failures were never in that code -- one
# was vcpkg's own version-resolution semantics, the other was a GitHub
# Actions cache/batch-script interaction. Both had to be diagnosed and fixed
# blind, from CI logs alone, with no Windows machine to reproduce on.
#
# Active development is macOS-only going forward. Running this automatically
# on every push would mean it silently re-breaks on Windows/vcpkg-ecosystem
# drift that has nothing to do with the change being made, and gates merges
# on a platform nobody can currently debug directly. Run it deliberately --
# before a release, when actually touching Windows-relevant paths (CMakeLists
# .txt, vcpkg.json, scripts/*.ps1, src/), or if this project picks back up
# multi-platform work -- via the "Run workflow" button, not automatically.
#
# See architecture/README.md and README.md's Platform Support table for the
# same reasoning documented alongside the rest of the platform story, and
# validate-backend.yml for the job that used to live in this file: it has
# nothing to do with Windows and stayed on its normal automatic trigger.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild tooling
        uses: microsoft/setup-msbuild@v1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Python (some vcpkg scripts use Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clone vcpkg
        shell: cmd
        run: |
          if not exist "%VCPKG_ROOT%" (
            git clone https://github.com/microsoft/vcpkg.git "%VCPKG_ROOT%"
          )
          pushd "%VCPKG_ROOT%"
          REM The cache step above falls back to restore-keys on a cache-key
          REM miss, which happens on every vcpkg.json change (that file is the
          REM cache key). Its restore-keys prefix matches ANY older cache for
          REM this OS, including one from before builtin-baseline was pinned, so
          REM its .git history may not contain the commit vcpkg.json now
          REM references -- while vcpkg.exe from that same stale cache still
          REM exists on disk, so the old "skip clone if vcpkg.exe present"
          REM check never noticed. Always fetch so a cached-but-stale clone's
          REM history is current; this is exactly what vcpkg's own error
          REM message asks for when it cannot find a pinned baseline commit.
          git fetch --all --tags
          if not exist vcpkg.exe (
            call bootstrap-vcpkg.bat
          )
          popd

      - name: Install vcpkg packages
        shell: cmd
        run: |
          set "VCPKG=%VCPKG_ROOT%\vcpkg.exe"
          "%VCPKG%" install --triplet x64-windows

      - name: Configure (CMake)
        shell: cmd
        run: |
          if not exist build mkdir build
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        shell: cmd
        run: cmake --build build --config Release

      - name: Run Integration Tests
        shell: cmd
        run: |
          echo Running delivery foundation integration tests...
          build\Release\test_delivery_foundation.exe
          if errorlevel 1 (
            echo Integration tests FAILED
            exit /b 1
          )
          echo Integration tests PASSED

      - name: Run Lua Evaluator Tests
        shell: cmd
        run: |
          echo Running Lua evaluator tests...
          build\Release\test_lua_evaluator.exe policies\macos_policy.json
          if errorlevel 1 (
            echo Lua evaluator tests FAILED
            exit /b 1
          )
          echo Lua evaluator tests PASSED

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-binaries
          path: |
            build/Release/*.exe
