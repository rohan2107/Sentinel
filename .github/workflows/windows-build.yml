name: Windows Build (CMake + vcpkg)

# Trigger on pushes / PRs to master and feature branches
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild tooling
        uses: microsoft/setup-msbuild@v1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Python (some vcpkg scripts use Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clone vcpkg
        shell: cmd
        run: |
          if not exist "%VCPKG_ROOT%" (
            git clone https://github.com/microsoft/vcpkg.git "%VCPKG_ROOT%"
          )
          pushd "%VCPKG_ROOT%"
          REM The cache step above falls back to restore-keys on a cache-key
          REM miss, which happens on every vcpkg.json change (that file is the
          REM cache key). Its restore-keys prefix matches ANY older cache for
          REM this OS, including one from before builtin-baseline was pinned, so
          REM its .git history may not contain the commit vcpkg.json now
          REM references -- while vcpkg.exe from that same stale cache still
          REM exists on disk, so the old "skip clone if vcpkg.exe present"
          REM check never noticed. Always fetch so a cached-but-stale clone's
          REM history is current; this is exactly what vcpkg's own error
          REM message asks for when it cannot find a pinned baseline commit.
          git fetch --all --tags
          if not exist vcpkg.exe (
            call bootstrap-vcpkg.bat
          )
          popd

      - name: Install vcpkg packages
        shell: cmd
        run: |
          set "VCPKG=%VCPKG_ROOT%\vcpkg.exe"
          "%VCPKG%" install --triplet x64-windows

      - name: Configure (CMake)
        shell: cmd
        run: |
          if not exist build mkdir build
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        shell: cmd
        run: cmake --build build --config Release

      - name: Run Integration Tests
        shell: cmd
        run: |
          echo Running delivery foundation integration tests...
          build\Release\test_delivery_foundation.exe
          if errorlevel 1 (
            echo Integration tests FAILED
            exit /b 1
          )
          echo Integration tests PASSED

      - name: Run Lua Evaluator Tests
        shell: cmd
        run: |
          echo Running Lua evaluator tests...
          build\Release\test_lua_evaluator.exe policies\macos_policy.json
          if errorlevel 1 (
            echo Lua evaluator tests FAILED
            exit /b 1
          )
          echo Lua evaluator tests PASSED

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-binaries
          path: |
            build/Release/*.exe

  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint backend (syntax + import check)
        run: python -m py_compile backend/server.py

      - name: Validate policy JSON files
        run: |
          python -c "
          import json, sys, pathlib
          errors = 0
          for p in pathlib.Path('policies').glob('*.json'):
              try:
                  data = json.loads(p.read_text())
                  assert 'policy_name' in data or 'rules' in data, f'Missing policy_name or rules key'
                  print(f'  [OK] {p}')
              except Exception as e:
                  print(f'  [FAIL] {p}: {e}', file=sys.stderr)
                  errors += 1
          sys.exit(1 if errors else 0)
          "
