name: Windows Build (CMake + vcpkg)

# Trigger on pushes / PRs to the repo's main development branch (master)
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # vcpkg root inside the workspace
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild tooling
        uses: microsoft/setup-msbuild@v1

      # vcpkg bootstrap + installs can be slow on cold CI runs.
      # We cache the entire vcpkg directory to speed up subsequent builds.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\vcpkg
          key: vcpkg-${{ runner.os }}-nlohmann-json-spdlog-sol2-lua-sqlite3-cpp-httplib-v1
          # restore-keys fallback:
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Python (some vcpkg scripts use Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clone vcpkg
        # Use cmd shell to keep syntax consistent with later steps
        shell: cmd
        run: |
          if not exist "%VCPKG_ROOT%\vcpkg.exe" (
            if not exist "%VCPKG_ROOT%" (
              git clone https://github.com/microsoft/vcpkg.git "%VCPKG_ROOT%"
            )
            pushd "%VCPKG_ROOT%"
            bootstrap-vcpkg.bat
            popd
          ) else (
            echo vcpkg.exe already present
          )

      - name: Install vcpkg packages
        shell: cmd
        run: |
          set "VCPKG=%VCPKG_ROOT%\vcpkg.exe"
          "%VCPKG%" install --triplet x64-windows

      - name: Configure (CMake)
        shell: cmd
        run: |
          if not exist build mkdir build
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        shell: cmd
        run: cmake --build build --config Release

      - name: Build (Debug)
        shell: cmd
        run: cmake --build build --config Debug

      - name: Run Integration Tests (Debug)
        shell: cmd
        run: |
          echo Running delivery foundation integration tests...
          build\Debug\test_delivery_foundation.exe
          if errorlevel 1 (
            echo Integration tests FAILED
            exit /b 1
          )
          echo Integration tests PASSED

      - name: Upload build artifact (build folder)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cmake-build
          path: build
